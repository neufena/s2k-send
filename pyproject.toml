[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s2k-send"
dynamic = ["version"]
description = "Send samples to an Akai S2000 over SCSI from a Raspberry Pi with a PiSCSI board"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "John Mitchell" }]
keywords = ["akai", "s2000", "sampler", "scsi", "piscsi", "raspberry-pi"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Repository = "https://github.com/neufena/s2k-send"
Changelog = "https://github.com/neufena/s2k-send/blob/main/CHANGELOG.md"

[project.scripts]
s2ksend = "s2ksend:main"
s2kserver = "s2kserver:main"

[tool.setuptools]
py-modules = ["s2kcore", "s2kclient", "s2kserver", "s2ksend"]

[tool.setuptools.dynamic]
version = { attr = "s2kcore.__version__" }
